name: Execute PIGTAILS student tutorial
on:
  push:
    branches: [teaching/pigtails-synthetic-brain-notebook]
    paths:
      - notebooks/PIGTAILS_Synthetic_Brain_Student_Tutorial.ipynb
      - .github/workflows/pigtails-tutorial.yml
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook dependencies
        run: python -m pip install numpy scipy nibabel matplotlib nbformat nbclient ipykernel
      - name: Execute notebook on real anatomical labels
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path("notebooks/PIGTAILS_Synthetic_Brain_Student_Tutorial.ipynb")
          notebook = nbformat.read(path, as_version=4)
          client = NotebookClient(notebook, timeout=300, kernel_name="python3", resources={"metadata": {"path": "."}})
          try:
              client.execute()
          finally:
              nbformat.write(notebook, "PIGTAILS_Real_Brain_Executed.ipynb")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PIGTAILS-real-brain-executed
          retention-days: 30
          path: |
            PIGTAILS_Real_Brain_Executed.ipynb
            pigtails_student_outputs/*.png
            pigtails_student_outputs/*.json
